name: Build

on:
  push:
    branches: [main]
    tags: ['v*', 'nexus-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "AMMOSWAP_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "NEXUS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "AMMOSWAP_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Name the zip
        shell: bash
        run: mv build/HFWAmmoSwap.zip "build/HFWAmmoSwap-$AMMOSWAP_VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: HFWAmmoSwap-${{ env.AMMOSWAP_VERSION }}
          path: |
            build/HFWAmmoSwap-${{ env.AMMOSWAP_VERSION }}.zip
            build/HFWAmmoSwap.pdb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/HFWAmmoSwap-${{ env.AMMOSWAP_VERSION }}.zip
          generate_release_notes: true

  # Adds the release zip as a new version of the mod's existing Nexus Mods file: on a version tag,
  # or for an existing release on a "nexus-<release tag>" tag (for example nexus-v1.0.1). Needs the
  # repository secret NEXUSMODS_API_KEY and the variables NEXUS_MOD_ID and NEXUS_FILE_ID; skipped
  # until NEXUS_FILE_ID is set. A separate job, so a failed upload can be retried with "Re-run
  # failed jobs": the release itself is immutable and can't be published again.
  nexus:
    needs: build
    if: vars.NEXUS_FILE_ID != '' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/nexus-v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download the release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#nexus-}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "HFWAmmoSwap-$TAG.zip"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "NEXUS_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: HFWAmmoSwap-${{ env.TAG }}.zip
          version: ${{ env.NEXUS_VERSION }}
          display_name: HFW Ammo Swap
          description: Requires Native Loader. Extract into <game folder>\nativemods\.
          changelog: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}
          archive_existing_version: true
          update_mod_version: true
