name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "AMMOSWAP_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "AMMOSWAP_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Name the zip
        shell: bash
        run: mv build/HFWAmmoSwap.zip "build/HFWAmmoSwap-$AMMOSWAP_VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: HFWAmmoSwap-${{ env.AMMOSWAP_VERSION }}
          path: |
            build/HFWAmmoSwap-${{ env.AMMOSWAP_VERSION }}.zip
            build/HFWAmmoSwap.pdb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/HFWAmmoSwap-${{ env.AMMOSWAP_VERSION }}.zip
          generate_release_notes: true
